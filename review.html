<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康台灣深耕計畫 - 主管審核操作區</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
            min-height: 100vh;
            font-size: 20px; /* 基礎字型大小至少 20px */
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        /* 避免加大字型後超出邊框 */
        select, input, textarea, button, div, span, p {
            word-break: break-word;
            overflow-wrap: break-word;
        }
        select option {
            font-size: 18px;
            padding: 8px;
        }
    </style>
</head>
<body class="text-slate-800 antialiased py-8 px-3 sm:px-6 lg:px-8 text-xl">

    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-10">
            <div class="inline-flex items-center justify-center p-4 bg-white/20 rounded-full shadow-lg mb-4 text-white">
                <i class="fa-solid fa-user-check text-4xl"></i>
            </div>
            <h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight drop-shadow-md">
                健康台灣深耕計畫
            </h1>
            <p class="text-purple-100 text-xl sm:text-2xl mt-3 font-medium">主管 / 計畫負責人審核操作專區</p>
        </header>

        <main class="space-y-6">
            <div class="glass-card rounded-3xl shadow-2xl p-6 sm:p-8">
                <div class="flex flex-wrap items-center justify-between border-b border-purple-100 pb-4 mb-6 gap-2">
                    <h2 class="text-2xl sm:text-3xl font-bold text-purple-900 flex items-center gap-3">
                        <i class="fa-solid fa-shield-halved text-purple-600"></i>
                        審核身分登入驗證
                    </h2>
                    <span class="px-3 py-1 bg-purple-100 text-purple-800 text-lg font-bold rounded-full uppercase tracking-wider">密碼保護</span>
                </div>

                <div class="space-y-6">
                    <div class="p-6 rounded-2xl bg-purple-50/90 border border-purple-200/80 shadow-sm space-y-5">
                        <h3 class="font-bold text-purple-950 text-2xl flex items-center gap-2">
                            <i class="fa-solid fa-lock text-purple-700"></i> 選擇主管身分並輸入驗證密碼
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                            <div>
                                <label class="block text-xl font-bold text-purple-950 mb-2">選擇主管身分 / 負責人 <span class="text-purple-600">*</span></label>
                                <select id="reviewSupervisorSelect" class="w-full rounded-xl border-2 border-purple-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-purple-500 font-medium">
                                    <option value="">請選擇您的主管身分...</option>
                                    <optgroup label="範疇一">
                                        <option value="劉季惠">劉季惠</option><option value="蔡斗元">蔡斗元</option><option value="唐家沛">唐家沛</option><option value="曾志恩">曾志恩</option><option value="林真福">林真福</option><option value="陳可家">陳可家</option><option value="李紀慧">李紀慧</option>
                                    </optgroup>
                                    <optgroup label="範疇二">
                                        <option value="陳弘美">陳弘美</option><option value="李宜恭">李宜恭</option>
                                    </optgroup>
                                    <optgroup label="範疇三">
                                        <option value="黃智瑋">黃智瑋</option><option value="林庭光">林庭光</option>
                                    </optgroup>
                                    <optgroup label="範疇四">
                                        <option value="葉明憲">葉明憲</option><option value="楊佳瑜">楊佳瑜</option><option value="鄭秀晶">鄭秀晶</option><option value="陳佳蓉">陳佳蓉</option><option value="陳敬森">陳敬森</option><option value="顏貴珍">顏貴珍</option><option value="陳志偉">陳志偉</option><option value="劉鎮榮">劉鎮榮</option>
                                    </optgroup>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xl font-bold text-purple-950 mb-2">輸入專屬安全密碼 <span class="text-purple-600">*</span></label>
                                <div class="relative">
                                    <input type="password" id="reviewPinInput" placeholder="請輸入主管密碼" class="w-full rounded-xl border-2 border-purple-200 bg-white p-3 pr-12 text-xl text-slate-800 focus:ring-2 focus:ring-purple-500 font-medium">
                                    <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-purple-700 cursor-pointer text-xl">
                                        <i id="togglePasswordIcon" class="fa-solid fa-eye-slash"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="flex items-end">
                                <button type="button" id="fetchPendingBtn" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-extrabold py-3.5 px-5 rounded-xl shadow-lg transition flex items-center justify-center gap-3 text-xl cursor-pointer">
                                    <i class="fa-solid fa-rotate text-2xl"></i> 驗證並載入待審清單
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Pending Cases Container -->
                    <div id="pendingCasesContainer" class="space-y-5">
                        <div class="text-center py-10 text-slate-500 bg-white/60 rounded-2xl border border-purple-100">
                            <i class="fa-solid fa-inbox text-4xl mb-3 text-purple-400"></i>
                            <p class="text-xl font-medium">請先選擇主管身分並輸入對應密碼以查詢待審核案件。</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Review Modal -->
    <div id="reviewModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden text-xl">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-2xl w-full shadow-2xl space-y-5 my-8 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-purple-200 pb-4">
                <h3 class="text-2xl font-extrabold text-purple-950 flex items-center gap-3">
                    <i class="fa-solid fa-signature text-purple-600"></i> 審核表單覆核作業
                </h3>
                <button id="closeReviewModal" class="text-slate-400 hover:text-slate-700 text-2xl font-bold cursor-pointer p-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="reviewModalDetails" class="space-y-4 text-xl text-slate-800 bg-purple-50 p-5 rounded-2xl border border-purple-200 leading-relaxed"></div>
            <div>
                <label class="block text-xl font-bold text-purple-950 mb-2">主管審核評語 / 意見說明</label>
                <textarea id="supervisorComment" rows="3" placeholder="請填寫審核意見（若退件請務必說明原因）..." class="w-full rounded-2xl border-2 border-purple-200 bg-purple-50/50 p-4 text-slate-800 focus:ring-2 focus:ring-purple-500 focus:outline-none transition text-xl font-medium"></textarea>
            </div>
            <div class="flex flex-col sm:flex-row gap-4 pt-2">
                <button type="button" id="rejectActionBtn" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-extrabold py-4 px-6 rounded-2xl shadow-lg transition flex items-center justify-center gap-3 text-xl cursor-pointer">
                    <i class="fa-solid fa-circle-xmark text-2xl"></i> 退件 (Reject)
                </button>
                <button type="button" id="approveActionBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-4 px-6 rounded-2xl shadow-lg transition flex items-center justify-center gap-3 text-xl cursor-pointer">
                    <i class="fa-solid fa-circle-check text-2xl"></i> 核准 (Approve)
                </button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxy6nsJ_heTEtRmnHeAN6jMnWTiZx2c4E5wXw-vmIqIgBMiAyCqyxk0zLUzdGqV8-n5/exec";

        function showCustomMessage(message, title = "系統提示") {
            const m = document.createElement('div');
            m.className = "fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 text-xl";
            m.innerHTML = `
                <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl text-center space-y-6">
                    <h3 class="text-2xl font-extrabold text-slate-900">${title}</h3>
                    <p class="text-xl text-slate-700 font-medium leading-relaxed">${message}</p>
                    <button id="closeMsgBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-extrabold py-3.5 rounded-2xl transition cursor-pointer text-xl">確定</button>
                </div>
            `;
            document.body.appendChild(m);
            document.getElementById('closeMsgBtn').addEventListener('click', () => m.remove());
        }

        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const reviewPinInput = document.getElementById('reviewPinInput');
        const togglePasswordIcon = document.getElementById('togglePasswordIcon');

        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = reviewPinInput.type === 'password';
            reviewPinInput.type = isPassword ? 'text' : 'password';
            togglePasswordIcon.className = isPassword ? 'fa-solid fa-eye text-purple-600' : 'fa-solid fa-eye-slash';
        });

        const fetchPendingBtn = document.getElementById('fetchPendingBtn');
        const reviewSupervisorSelect = document.getElementById('reviewSupervisorSelect');
        const pendingCasesContainer = document.getElementById('pendingCasesContainer');
        const reviewModal = document.getElementById('reviewModal');
        const closeReviewModal = document.getElementById('closeReviewModal');
        const reviewModalDetails = document.getElementById('reviewModalDetails');
        const supervisorComment = document.getElementById('supervisorComment');
        const rejectActionBtn = document.getElementById('rejectActionBtn');
        const approveActionBtn = document.getElementById('approveActionBtn');

        let currentActiveRowIndex = null;

        fetchPendingBtn.addEventListener('click', async function() {
            const supervisor = reviewSupervisorSelect.value;
            const pin = reviewPinInput.value.trim();

            if (!supervisor) {
                showCustomMessage("請先選擇您的主管身分！", "警告");
                return;
            }
            if (!pin) {
                showCustomMessage("請輸入您的專屬安全密碼！", "警告");
                return;
            }

            pendingCasesContainer.innerHTML = `<div class="text-center py-10 text-purple-700 bg-white/60 rounded-2xl border border-purple-100 font-bold"><i class="fa-solid fa-spinner fa-spin text-4xl mb-3"></i><p class="text-xl">正在驗證密碼並載入待審清單...</p></div>`;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getPending&supervisor=${encodeURIComponent(supervisor)}&pin=${encodeURIComponent(pin)}`);
                const data = await res.json();

                if (data.status === "success") {
                    const cases = data.cases || [];
                    if (cases.length === 0) {
                        pendingCasesContainer.innerHTML = `
                            <div class="text-center py-10 text-slate-600 bg-white/70 rounded-2xl border border-purple-100 p-6">
                                <i class="fa-solid fa-circle-check text-4xl mb-3 text-emerald-500"></i>
                                <p class="text-xl font-bold text-slate-800">密碼驗證成功！目前沒有屬於「${supervisor}」主管的待審核案件。</p>
                            </div>
                        `;
                        return;
                    }

                    let html = `<div class="p-4 bg-emerald-50 text-emerald-900 text-xl font-bold rounded-2xl border border-emerald-300 mb-3 flex items-center gap-2"><i class="fa-solid fa-shield-check text-emerald-600 text-2xl"></i> 密碼驗證成功！目前顯示屬於「${supervisor}」的待審核案件：</div>`;
                    cases.forEach(item => {
                        html += `
                            <div class="bg-white p-6 rounded-3xl border border-purple-200 shadow-md flex flex-col justify-between items-start gap-5">
                                <div class="space-y-4 w-full">
                                    <div class="flex items-center gap-3 flex-wrap">
                                        <span class="px-3 py-1 bg-purple-100 text-purple-900 text-lg font-extrabold rounded-lg">列次 #${item.rowIndex}</span>
                                        <span class="text-lg font-medium text-slate-500">${item.timestamp}</span>
                                        <span class="px-3 py-1 bg-amber-100 text-amber-900 text-lg font-bold rounded-lg">${item.status}</span>
                                        <span class="text-lg font-bold text-indigo-800 bg-indigo-50 px-3 py-1 rounded-lg border border-indigo-100">申請人：${item.applicantName}</span>
                                    </div>
                                    
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-purple-50/70 p-5 rounded-2xl border border-purple-200 text-lg">
                                        <div class="space-y-2">
                                            <span class="font-bold text-rose-800 text-xl flex items-center gap-2"><i class="fa-solid fa-circle-minus text-rose-600"></i> 經費流出：</span>
                                            <p class="text-rose-950 font-bold bg-rose-100/80 p-2 rounded-xl">流出子計畫：${item.fromSubProject || '未記錄'}</p>
                                            <p class="text-slate-800 font-medium"><strong>${item.fromSource}</strong> | ${item.fromCategory} - ${item.fromItem}</p>
                                            <p class="text-rose-950 bg-rose-100 p-2 rounded-xl border border-rose-200">流出細項名稱：<strong class="text-rose-950">${item.fromDetail || '無'}</strong></p>
                                            <p class="font-extrabold text-rose-700 text-xl">金額：$${Number(item.fromAmount).toLocaleString()}</p>
                                        </div>
                                        <div class="space-y-2 border-t md:border-t-0 md:border-l border-purple-200 pt-3 md:pt-0 md:pl-4">
                                            <span class="font-bold text-emerald-800 text-xl flex items-center gap-2"><i class="fa-solid fa-circle-plus text-emerald-600"></i> 經費流入：</span>
                                            <p class="text-emerald-950 font-bold bg-emerald-100/80 p-2 rounded-xl">流入子計畫：${item.toSubProject || '未記錄'}</p>
                                            <p class="text-slate-800 font-medium"><strong>${item.toSource}</strong> | ${item.toCategory} - ${item.toItem}</p>
                                            <p class="text-emerald-950 bg-emerald-100 p-2 rounded-xl border border-emerald-200">流入細項名稱：<strong class="text-emerald-950">${item.toDetail || '無'}</strong></p>
                                            <p class="font-extrabold text-emerald-700 text-xl">金額：$${Number(item.toAmount).toLocaleString()}</p>
                                        </div>
                                    </div>

                                    <p class="text-lg text-slate-800 font-medium leading-relaxed"><strong>變更理由：</strong> ${item.reason}</p>
                                </div>
                                <button type="button" onclick="openReviewModal(${item.rowIndex}, '${item.applicantName}', '${item.reason.replace(/'/g, "\\'")}', '${item.fromSubProject || ''}', '${item.fromSource}', '${item.fromCategory}', '${item.fromItem}', '${item.fromDetail}', '${item.fromAmount}', '${item.toSubProject || ''}', '${item.toSource}', '${item.toCategory}', '${item.toItem}', '${item.toDetail}', '${item.toAmount}')" class="w-full sm:w-auto bg-purple-700 hover:bg-purple-800 text-white font-extrabold py-3.5 px-6 rounded-2xl text-xl shadow-lg transition flex items-center justify-center gap-2 whitespace-nowrap cursor-pointer self-end">
                                    <i class="fa-solid fa-pen-nib text-xl"></i> 進行審核
                                </button>
                            </div>
                        `;
                    });
                    pendingCasesContainer.innerHTML = html;
                } else {
                    pendingCasesContainer.innerHTML = `<div class="p-5 text-rose-800 text-xl bg-rose-100 rounded-2xl border border-rose-300 font-bold"><i class="fa-solid fa-circle-xmark text-rose-600"></i> 驗證失敗：${data.message}</div>`;
                }
            } catch (err) {
                console.error(err);
                pendingCasesContainer.innerHTML = `<div class="p-5 text-rose-800 text-xl bg-rose-100 rounded-2xl font-bold">連線錯誤，無法載入清單。</div>`;
            }
        });

        window.openReviewModal = function(rowIndex, applicant, reason, fSubProj, fSource, fCat, fItem, fDetail, fromAmt, tSubProj, tSource, tCat, tItem, tDetail, toAmt) {
            currentActiveRowIndex = rowIndex;
            reviewModalDetails.innerHTML = `
                <div class="grid grid-cols-2 gap-3 pb-3 border-b border-purple-200 font-bold">
                    <div><strong>列次：</strong> #${rowIndex}</div>
                    <div><strong>申請人：</strong> ${applicant}</div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 py-2">
                    <div class="bg-rose-50 p-4 rounded-2xl border border-rose-200 space-y-2">
                        <span class="font-extrabold text-rose-900 text-lg flex items-center gap-1.5"><i class="fa-solid fa-circle-minus text-rose-600"></i> 流出項目：</span>
                        <div class="text-base bg-rose-100/90 p-2 rounded-lg font-bold text-rose-950">流出子計畫：${fSubProj || '未記錄'}</div>
                        <div class="text-base text-slate-800 font-medium"><strong>${fSource}</strong> | ${fCat} - ${fItem}</div>
                        <div class="text-base bg-rose-100 p-2 rounded-lg border border-rose-200 text-rose-950 font-bold">細項名稱：${fDetail || '無'}</div>
                        <div class="font-extrabold text-rose-700 text-lg pt-1">金額：$${Number(fromAmt).toLocaleString()}</div>
                    </div>
                    <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200 space-y-2">
                        <span class="font-extrabold text-emerald-900 text-lg flex items-center gap-1.5"><i class="fa-solid fa-circle-plus text-emerald-600"></i> 流入項目：</span>
                        <div class="text-base bg-emerald-100/90 p-2 rounded-lg font-bold text-emerald-950">流入子計畫：${tSubProj || '未記錄'}</div>
                        <div class="text-base text-slate-800 font-medium"><strong>${tSource}</strong> | ${tCat} - ${tItem}</div>
                        <div class="text-base bg-emerald-100 p-2 rounded-lg border border-emerald-200 text-emerald-950 font-bold">細項名稱：${tDetail || '無'}</div>
                        <div class="font-extrabold text-emerald-700 text-lg pt-1">金額：$${Number(toAmt).toLocaleString()}</div>
                    </div>
                </div>
                <div class="pt-2"><strong>變更理由與效益：</strong><br><span class="text-slate-800 bg-white p-3 rounded-xl block mt-2 border border-purple-200 font-medium">${reason}</span></div>
            `;
            supervisorComment.value = "";
            reviewModal.classList.remove('hidden');
        }

        closeReviewModal.addEventListener('click', () => reviewModal.classList.add('hidden'));

        async function submitReviewDecision(decision) {
            if (!currentActiveRowIndex) return;
            const comment = supervisorComment.value;
            const supervisor = reviewSupervisorSelect.value;

            approveActionBtn.disabled = true;
            rejectActionBtn.disabled = true;

            const payload = {
                action: "review",
                rowIndex: currentActiveRowIndex,
                decision: decision,
                supervisorName: supervisor,
                comment: comment
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                showCustomMessage(`審核結果已成功儲存：[${decision}]`, "審核完成");
                reviewModal.classList.add('hidden');
                fetchPendingBtn.click();
            } catch (err) {
                console.error(err);
                showCustomMessage("送出審核結果時發生錯誤。", "錯誤");
            } finally {
                approveActionBtn.disabled = false;
                rejectActionBtn.disabled = false;
            }
        }

        approveActionBtn.addEventListener('click', () => submitReviewDecision("核准"));
        rejectActionBtn.addEventListener('click', () => submitReviewDecision("退件"));
    </script>
</body>
</html>
