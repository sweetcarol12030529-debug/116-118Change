<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康台灣深耕計畫 - 主管審核操作區</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter 字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #4c1d95 0%, #6d28d9 50%, #7c3aed 100%);
            min-height: 100vh;
            font-size: 16px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        select, input, textarea, button, div, span, p {
            word-break: break-word;
            overflow-wrap: break-word;
        }
        select option {
            font-size: 15px;
            padding: 6px;
        }
    </style>
</head>
<body class="text-slate-800 antialiased py-6 px-3 sm:px-6 lg:px-8 text-base">

    <div class="max-w-5xl mx-auto">
        <!-- 頁頭標題 -->
        <header class="text-center mb-8">
            <div class="inline-flex items-center justify-center p-3.5 bg-white/20 rounded-full shadow-lg mb-3 text-white">
                <i class="fa-solid fa-user-check text-3xl"></i>
            </div>
            <h1 class="text-2xl sm:text-4xl font-extrabold text-white tracking-tight drop-shadow-md">
                健康台灣深耕計畫
            </h1>
            <p class="text-purple-100 text-base sm:text-lg mt-2 font-medium">主管 / 計畫負責人審核操作專區</p>
        </header>

        <main class="space-y-6">
            <div class="glass-card rounded-3xl shadow-2xl p-5 sm:p-7">
                <div class="flex flex-wrap items-center justify-between border-b border-purple-100 pb-3.5 mb-5 gap-2">
                    <h2 class="text-xl sm:text-2xl font-bold text-purple-900 flex items-center gap-2.5">
                        <i class="fa-solid fa-shield-halved text-purple-600"></i>
                        審核身分登入驗證
                    </h2>
                    <span class="px-3 py-1 bg-purple-100 text-purple-800 text-sm font-bold rounded-full uppercase tracking-wider">密碼保護</span>
                </div>

                <div class="space-y-5">
                    <!-- 主管身分與密碼輸入區 -->
                    <div class="p-5 rounded-2xl bg-purple-50/90 border border-purple-200/80 shadow-sm space-y-4">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <h3 class="font-bold text-purple-950 text-lg flex items-center gap-2">
                                <i class="fa-solid fa-lock text-purple-700"></i> 選擇主管身分並輸入驗證密碼
                            </h3>
                            <!-- 主管登出狀態列 (驗證通過後顯示) -->
                            <div id="supervisorLoggedInBar" class="hidden flex items-center gap-2">
                                <span class="text-sm font-bold text-purple-900 bg-white px-3 py-1.5 rounded-xl border border-purple-200 shadow-xs">
                                    <i class="fa-solid fa-user-tie text-purple-600 mr-1"></i>目前主管：<span id="currentSupervisorName" class="text-indigo-700"></span>
                                </span>
                                <button type="button" id="supervisorLogoutBtn" class="bg-rose-600 hover:bg-rose-700 text-white text-sm font-bold py-1.5 px-3.5 rounded-xl shadow-sm transition cursor-pointer inline-flex items-center gap-1.5">
                                    <i class="fa-solid fa-right-from-bracket"></i> 登出
                                </button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div>
                                <label class="block text-sm font-bold text-purple-950 mb-1.5">1. 選擇簽核角色 <span class="text-purple-600">*</span></label>
                                <select id="reviewRoleSelect" class="w-full rounded-xl border border-purple-300 bg-white p-2.5 text-base text-slate-800 focus:ring-2 focus:ring-purple-500 font-medium">
                                    <option value="子計畫負責人">第一關：子計畫負責人</option>
                                    <option value="各範疇副召集人">第二關：各範疇副召集人</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-purple-950 mb-1.5">2. 選擇您的姓名 <span class="text-purple-600">*</span></label>
                                <select id="reviewSupervisorSelect" class="w-full rounded-xl border border-purple-300 bg-white p-2.5 text-base text-slate-800 focus:ring-2 focus:ring-purple-500 font-medium">
                                    <option value="">正在載入名單...</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-purple-950 mb-1.5">3. 輸入專屬安全密碼 <span class="text-purple-600">*</span></label>
                                <div class="relative">
                                    <input type="password" id="reviewPinInput" placeholder="請輸入安全密碼" class="w-full rounded-xl border border-purple-300 bg-white p-2.5 pr-11 text-base text-slate-800 focus:ring-2 focus:ring-purple-500 font-medium">
                                    <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-purple-700 cursor-pointer text-base">
                                        <i id="togglePasswordIcon" class="fa-solid fa-eye-slash"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="flex items-end">
                                <button type="button" id="fetchPendingBtn" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-base cursor-pointer">
                                    <i class="fa-solid fa-rotate text-lg"></i> 驗證並載入待審清單
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- 待審核案件清單容器 -->
                    <div id="pendingCasesContainer" class="space-y-4">
                        <div class="text-center py-8 text-slate-500 bg-white/60 rounded-2xl border border-purple-100">
                            <i class="fa-solid fa-inbox text-3xl mb-2.5 text-purple-400"></i>
                            <p class="text-base font-medium">請先選擇主管身分並輸入對應密碼以查詢待審核案件。</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 審核彈出對話視窗 (Review Modal) -->
    <div id="reviewModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden text-base">
        <div class="bg-white rounded-3xl p-5 sm:p-7 max-w-2xl w-full shadow-2xl space-y-4 my-6 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-purple-200 pb-3">
                <h3 class="text-xl font-extrabold text-purple-950 flex items-center gap-2.5">
                    <i class="fa-solid fa-signature text-purple-600"></i> 審核表單覆核作業
                </h3>
                <button id="closeReviewModal" class="text-slate-400 hover:text-slate-700 text-xl font-bold cursor-pointer p-1.5"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="reviewModalDetails" class="space-y-3 text-sm sm:text-base text-slate-800 bg-purple-50 p-4 rounded-2xl border border-purple-200 leading-relaxed"></div>
            <div>
                <label class="block text-sm font-bold text-purple-950 mb-1.5">主管審核評語 / 意見說明 <span class="text-rose-600">*</span></label>
                <textarea id="supervisorComment" rows="3" required placeholder="請務必填寫審核意見或評語..." class="w-full rounded-2xl border border-purple-300 bg-purple-50/50 p-3 text-slate-800 focus:ring-2 focus:ring-purple-500 focus:outline-none transition text-base font-medium"></textarea>
            </div>
            <div class="flex flex-col sm:flex-row gap-3 pt-1">
                <button type="button" id="rejectActionBtn" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 px-5 rounded-2xl shadow-lg transition flex items-center justify-center gap-2 text-base cursor-pointer">
                    <i class="fa-solid fa-circle-xmark text-lg"></i> 退件 (Reject)
                </button>
                <button type="button" id="approveActionBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-5 rounded-2xl shadow-lg transition flex items-center justify-center gap-2 text-base cursor-pointer">
                    <i class="fa-solid fa-circle-check text-lg"></i> 核准 (Approve)
                </button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxy6nsJ_heTEtRmnHeAN6jMnWTiZx2c4E5wXw-vmIqIgBMiAyCqyxk0zLUzdGqV8-n5/exec";

        function showCustomMessage(message, title = "系統提示") {
            const m = document.createElement('div');
            m.className = "fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 text-base";
            m.innerHTML = `
                <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl text-center space-y-5">
                    <h3 class="text-xl font-extrabold text-slate-900">${title}</h3>
                    <p class="text-base text-slate-700 font-medium leading-relaxed">${message}</p>
                    <button id="closeMsgBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-2xl transition cursor-pointer text-base">確定</button>
                </div>
            `;
            document.body.appendChild(m);
            document.getElementById('closeMsgBtn').addEventListener('click', () => m.remove());
        }

        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const reviewPinInput = document.getElementById('reviewPinInput');
        const togglePasswordIcon = document.getElementById('togglePasswordIcon');

        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = reviewPinInput.type === 'password';
            reviewPinInput.type = isPassword ? 'text' : 'password';
            togglePasswordIcon.className = isPassword ? 'fa-solid fa-eye text-purple-600' : 'fa-solid fa-eye-slash';
        });

        const fetchPendingBtn = document.getElementById('fetchPendingBtn');
        const reviewRoleSelect = document.getElementById('reviewRoleSelect');
        const reviewSupervisorSelect = document.getElementById('reviewSupervisorSelect');
        const pendingCasesContainer = document.getElementById('pendingCasesContainer');
        const reviewModal = document.getElementById('reviewModal');
        const closeReviewModal = document.getElementById('closeReviewModal');
        const reviewModalDetails = document.getElementById('reviewModalDetails');
        const supervisorComment = document.getElementById('supervisorComment');
        const rejectActionBtn = document.getElementById('rejectActionBtn');
        const approveActionBtn = document.getElementById('approveActionBtn');
        const supervisorLoggedInBar = document.getElementById('supervisorLoggedInBar');
        const currentSupervisorName = document.getElementById('currentSupervisorName');
        const supervisorLogoutBtn = document.getElementById('supervisorLogoutBtn');

        let currentActiveRowIndex = null;

        // 預設名單（載入後端設定後會自動同步）
        let approversListCache = [
            { scope: "範疇一", roleType: "子計畫負責人", name: "劉季惠" },
            { scope: "範疇一", roleType: "子計畫負責人", name: "蔡斗元" },
            { scope: "範疇一", roleType: "子計畫負責人", name: "唐家沛" },
            { scope: "範疇一", roleType: "子計畫負責人", name: "曾志恩" },
            { scope: "範疇一", roleType: "子計畫負責人", name: "林真福" },
            { scope: "範疇一", roleType: "子計畫負責人", name: "陳可家" },
            { scope: "範疇一", roleType: "子計畫負責人", name: "李紀慧" },
            { scope: "範疇一", roleType: "各範疇副召集人", name: "範疇一副召集人" },
            { scope: "範疇二", roleType: "子計畫負責人", name: "陳弘美" },
            { scope: "範疇二", roleType: "子計畫負責人", name: "李宜恭" },
            { scope: "範疇二", roleType: "各範疇副召集人", name: "範疇二副召集人" },
            { scope: "範疇三", roleType: "子計畫負責人", name: "黃智瑋" },
            { scope: "範疇三", roleType: "子計畫負責人", name: "林庭光" },
            { scope: "範疇三", roleType: "各範疇副召集人", name: "範疇三副召集人" },
            { scope: "範疇四", roleType: "子計畫負責人", name: "葉明憲" },
            { scope: "範疇四", roleType: "子計畫負責人", name: "楊佳瑜" },
            { scope: "範疇四", roleType: "子計畫負責人", name: "鄭秀晶" },
            { scope: "範疇四", roleType: "子計畫負責人", name: "陳佳蓉" },
            { scope: "範疇四", roleType: "子計畫負責人", name: "陳敬森" },
            { scope: "範疇四", roleType: "子計畫負責人", name: "顏貴珍" },
            { scope: "範疇四", roleType: "子計畫負責人", name: "陳志偉" },
            { scope: "範疇四", roleType: "子計畫負責人", name: "劉鎮榮" },
            { scope: "範疇四", roleType: "各範疇副召集人", name: "範疇四副召集人" }
        ];

        function renderReviewerOptions() {
            const selectedRole = String(reviewRoleSelect.value || "").trim();
            const isViceConvener = (selectedRole === "各範疇副召集人" || selectedRole.indexOf("副召集人") !== -1);

            const filtered = approversListCache.filter(item => {
                const rType = String(item.roleType || "").trim();
                if (isViceConvener) {
                    return rType === "各範疇副召集人" || rType.indexOf("副召集人") !== -1;
                }
                return rType === "子計畫負責人" || rType.indexOf("負責人") !== -1;
            });

            reviewSupervisorSelect.innerHTML = `<option value="">請選擇${selectedRole}...</option>`;

            const scopes = ["範疇一", "範疇二", "範疇三", "範疇四"];
            const addedKeys = new Set();

            scopes.forEach(sc => {
                const scItems = filtered.filter(i => String(i.scope || "").trim() === sc);
                if (scItems.length > 0) {
                    const grp = document.createElement('optgroup');
                    grp.label = sc;
                    scItems.forEach(person => {
                        const pName = String(person.name || "").trim();
                        if (!pName) return;
                        const opt = document.createElement('option');
                        opt.value = pName;
                        opt.textContent = `${pName} (${sc})`;
                        grp.appendChild(opt);
                        addedKeys.add(`${sc}_${pName}`);
                    });
                    reviewSupervisorSelect.appendChild(grp);
                }
            });

            const others = filtered.filter(i => !addedKeys.has(`${String(i.scope || "").trim()}_${String(i.name || "").trim()}`));
            if (others.length > 0) {
                const otherGrp = document.createElement('optgroup');
                otherGrp.label = "其他簽核人員";
                others.forEach(person => {
                    const pName = String(person.name || "").trim();
                    if (!pName) return;
                    const opt = document.createElement('option');
                    opt.value = pName;
                    opt.textContent = person.scope ? `${pName} (${person.scope})` : pName;
                    otherGrp.appendChild(opt);
                });
                reviewSupervisorSelect.appendChild(otherGrp);
            }
        }

        reviewRoleSelect.addEventListener('change', renderReviewerOptions);

        async function initApproversFromServer() {
            renderReviewerOptions();
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getPublicApprovers&_t=${Date.now()}`);
                const data = await res.json();
                if (data.status === "success" && Array.isArray(data.approvers)) {
                    approversListCache = data.approvers;
                    renderReviewerOptions();
                }
            } catch (e) {
                console.warn("載入簽核名單失敗，使用預設名單", e);
            }
        }

        initApproversFromServer();

        // 主管登出操作
        supervisorLogoutBtn.addEventListener('click', () => {
            reviewRoleSelect.disabled = false;
            reviewSupervisorSelect.value = "";
            reviewPinInput.value = "";
            reviewSupervisorSelect.disabled = false;
            reviewPinInput.disabled = false;
            supervisorLoggedInBar.classList.add('hidden');
            currentSupervisorName.textContent = "";
            reviewModal.classList.add('hidden');
            currentActiveRowIndex = null;
            pendingCasesContainer.innerHTML = `
                <div class="text-center py-8 text-slate-500 bg-white/60 rounded-2xl border border-purple-100">
                    <i class="fa-solid fa-inbox text-3xl mb-2.5 text-purple-400"></i>
                    <p class="text-base font-medium">已登出。請重新選擇簽核身分並輸入對應密碼以查詢待審核案件。</p>
                </div>
            `;
            showCustomMessage("您已成功登出主管審核系統。", "已登出");
        });

        function escapeAttr(str) {
            return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\r?\n/g, '<br>');
        }

        fetchPendingBtn.addEventListener('click', async function() {
            const roleType = reviewRoleSelect.value;
            const supervisor = reviewSupervisorSelect.value;
            const pin = reviewPinInput.value.trim();

            if (!supervisor) {
                showCustomMessage("請先選擇您的簽核姓名！", "警告");
                return;
            }
            if (!pin) {
                showCustomMessage("請輸入您的專屬安全密碼！", "警告");
                return;
            }

            pendingCasesContainer.innerHTML = `<div class="text-center py-8 text-purple-700 bg-white/60 rounded-2xl border border-purple-100 font-bold"><i class="fa-solid fa-spinner fa-spin text-3xl mb-2.5"></i><p class="text-base">正在驗證密碼並載入待審清單...</p></div>`;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getPending&roleType=${encodeURIComponent(roleType)}&supervisor=${encodeURIComponent(supervisor)}&pin=${encodeURIComponent(pin)}`);
                const data = await res.json();

                if (data.status === "success") {
                    // 驗證成功，顯示登入狀態與登出按鈕，並鎖定身分切換避免誤操作
                    currentSupervisorName.textContent = `${supervisor} (${roleType})`;
                    supervisorLoggedInBar.classList.remove('hidden');
                    reviewRoleSelect.disabled = true;
                    reviewSupervisorSelect.disabled = true;
                    reviewPinInput.disabled = true;

                    const cases = data.cases || [];
                    if (cases.length === 0) {
                        pendingCasesContainer.innerHTML = `
                            <div class="text-center py-8 text-slate-600 bg-white/70 rounded-2xl border border-purple-100 p-5">
                                <i class="fa-solid fa-circle-check text-3xl mb-2.5 text-emerald-500"></i>
                                <p class="text-base font-bold text-slate-800">密碼驗證成功！目前沒有屬於「${supervisor} (${roleType})」的待審核案件。</p>
                            </div>
                        `;
                        return;
                    }

                    let html = `<div class="p-3.5 bg-emerald-50 text-emerald-900 text-base font-bold rounded-2xl border border-emerald-300 mb-3 flex items-center gap-2"><i class="fa-solid fa-shield-check text-emerald-600 text-lg"></i> 密碼驗證成功！目前顯示屬於「${supervisor} (${roleType})」的待審核案件：</div>`;
                    cases.forEach(item => {
                        html += `
                            <div class="bg-white p-5 rounded-3xl border border-purple-200 shadow-md flex flex-col justify-between items-start gap-4">
                                <div class="space-y-3 w-full">
                                    <div class="flex items-center gap-2.5 flex-wrap">
                                        <span class="px-2.5 py-0.5 bg-purple-100 text-purple-900 text-sm font-extrabold rounded-lg">列次 #${item.rowIndex}</span>
                                        <span class="text-sm font-medium text-slate-500">${item.timestamp}</span>
                                        <span class="px-2.5 py-0.5 bg-amber-100 text-amber-900 text-sm font-bold rounded-lg">${item.status}</span>
                                        <span class="text-sm font-bold text-indigo-800 bg-indigo-50 px-2.5 py-0.5 rounded-lg border border-indigo-100">申請人：${item.applicantName}</span>
                                    </div>
                                    ${item.workflowStr ? `<div class="text-xs sm:text-sm font-bold text-indigo-900 bg-indigo-50/70 px-3 py-1.5 rounded-xl border border-indigo-200"><i class="fa-solid fa-route mr-1.5 text-indigo-600"></i>簽核流程：${item.workflowStr}</div>` : ''}
                                    ${item.previousComment ? `<div class="text-xs sm:text-sm font-bold text-emerald-900 bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-200"><i class="fa-solid fa-comment-dots mr-1.5 text-emerald-600"></i>前關審核紀錄：${item.previousComment}</div>` : ''}
                                    
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5 bg-purple-50/70 p-4 rounded-2xl border border-purple-200 text-sm sm:text-base">
                                        <div class="space-y-1.5">
                                            <span class="font-bold text-rose-800 text-base flex items-center gap-1.5"><i class="fa-solid fa-circle-minus text-rose-600"></i> 經費流出：</span>
                                            <p class="text-rose-950 font-bold bg-rose-100/80 p-2 rounded-xl text-sm">流出子計畫：${item.fromSubProject || '未記錄'}</p>
                                            <p class="text-slate-800 font-medium text-sm"><strong>${item.fromSource}</strong> | ${item.fromCategory} - ${item.fromItem}</p>
                                            <p class="text-rose-950 bg-rose-100 p-2 rounded-xl border border-rose-200 text-sm">流出細項名稱：<strong class="text-rose-950">${item.fromDetail || '無'}</strong></p>
                                            <p class="font-extrabold text-rose-700 text-base">金額：$${Number(item.fromAmount).toLocaleString()}</p>
                                        </div>
                                        <div class="space-y-1.5 border-t md:border-t-0 md:border-l border-purple-200 pt-3 md:pt-0 md:pl-3.5">
                                            <span class="font-bold text-emerald-800 text-base flex items-center gap-1.5"><i class="fa-solid fa-circle-plus text-emerald-600"></i> 經費流入：</span>
                                            <p class="text-emerald-950 font-bold bg-emerald-100/80 p-2 rounded-xl text-sm">流入子計畫：${item.toSubProject || '未記錄'}</p>
                                            <p class="text-slate-800 font-medium text-sm"><strong>${item.toSource}</strong> | ${item.toCategory} - ${item.toItem}</p>
                                            <p class="text-emerald-950 bg-emerald-100 p-2 rounded-xl border border-emerald-200 text-sm">流入細項名稱：<strong class="text-emerald-950">${item.toDetail || '無'}</strong></p>
                                            <p class="font-extrabold text-emerald-700 text-base">金額：$${Number(item.toAmount).toLocaleString()}</p>
                                        </div>
                                    </div>
                                    <div class="bg-purple-50 p-3.5 rounded-2xl border border-purple-200 space-y-1.5">
                                        <p class="text-sm sm:text-base text-slate-800 font-bold"><strong>變更類型：</strong> <span class="text-purple-900">${item.reasonType || '未指定'}</span></p>
                                        <p class="text-sm sm:text-base text-slate-800 font-medium leading-relaxed"><strong>變更理由與效益：</strong> <span class="bg-white p-2.5 rounded-xl block mt-1 border border-purple-200 font-normal text-sm">${item.reason}</span></p>
                                    </div>
                                </div>
                                <button type="button" onclick="openReviewModal(${item.rowIndex}, '${escapeAttr(item.applicantName)}', '${escapeAttr(item.reasonType)}', '${escapeAttr(item.reason)}', '${escapeAttr(item.fromSubProject)}', '${escapeAttr(item.fromSource)}', '${escapeAttr(item.fromCategory)}', '${escapeAttr(item.fromItem)}', '${escapeAttr(item.fromDetail)}', '${item.fromAmount}', '${escapeAttr(item.toSubProject)}', '${escapeAttr(item.toSource)}', '${escapeAttr(item.toCategory)}', '${escapeAttr(item.toItem)}', '${escapeAttr(item.toDetail)}', '${item.toAmount}')" class="w-full sm:w-auto bg-purple-700 hover:bg-purple-800 text-white font-bold py-2.5 px-5 rounded-xl text-base shadow-md transition flex items-center justify-center gap-2 whitespace-nowrap cursor-pointer self-end">
                                    <i class="fa-solid fa-pen-nib text-base"></i> 進行審核
                                </button>
                            </div>
                        `;
                    });
                    pendingCasesContainer.innerHTML = html;
                } else {
                    pendingCasesContainer.innerHTML = `<div class="p-4 text-rose-800 text-base bg-rose-100 rounded-2xl border border-rose-300 font-bold"><i class="fa-solid fa-circle-xmark text-rose-600"></i> 驗證失敗：${data.message}</div>`;
                }
            } catch (err) {
                console.error(err);
                pendingCasesContainer.innerHTML = `<div class="p-4 text-rose-800 text-base bg-rose-100 rounded-2xl font-bold">連線錯誤，無法載入清單。</div>`;
            }
        });

        window.openReviewModal = function(rowIndex, applicant, reasonType, reason, fSubProj, fSource, fCat, fItem, fDetail, fromAmt, tSubProj, tSource, tCat, tItem, tDetail, toAmt) {
            currentActiveRowIndex = rowIndex;
            reviewModalDetails.innerHTML = `
                <div class="grid grid-cols-2 gap-2.5 pb-2.5 border-b border-purple-200 font-bold text-sm sm:text-base">
                    <div><strong>列次：</strong> #${rowIndex}</div>
                    <div><strong>申請人：</strong> ${applicant}</div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 py-1">
                    <div class="bg-rose-50 p-3.5 rounded-2xl border border-rose-200 space-y-1.5">
                        <span class="font-extrabold text-rose-900 text-sm sm:text-base flex items-center gap-1.5"><i class="fa-solid fa-circle-minus text-rose-600"></i> 流出項目：</span>
                        <div class="text-xs sm:text-sm bg-rose-100/90 p-2 rounded-lg font-bold text-rose-950">流出子計畫：${fSubProj || '未記錄'}</div>
                        <div class="text-xs sm:text-sm text-slate-800 font-medium"><strong>${fSource}</strong> | ${fCat} - ${fItem}</div>
                        <div class="text-xs sm:text-sm bg-rose-100 p-2 rounded-lg border border-rose-200 text-rose-950 font-bold">細項名稱：${fDetail || '無'}</div>
                        <div class="font-extrabold text-rose-700 text-base pt-0.5">金額：$${Number(fromAmt).toLocaleString()}</div>
                    </div>
                    <div class="bg-emerald-50 p-3.5 rounded-2xl border border-emerald-200 space-y-1.5">
                        <span class="font-extrabold text-emerald-900 text-sm sm:text-base flex items-center gap-1.5"><i class="fa-solid fa-circle-plus text-emerald-600"></i> 流入項目：</span>
                        <div class="text-xs sm:text-sm bg-emerald-100/90 p-2 rounded-lg font-bold text-emerald-950">流入子計畫：${tSubProj || '未記錄'}</div>
                        <div class="text-xs sm:text-sm text-slate-800 font-medium"><strong>${tSource}</strong> | ${tCat} - ${tItem}</div>
                        <div class="text-xs sm:text-sm bg-emerald-100 p-2 rounded-lg border border-emerald-200 text-emerald-950 font-bold">細項名稱：${tDetail || '無'}</div>
                        <div class="font-extrabold text-emerald-700 text-base pt-0.5">金額：$${Number(toAmt).toLocaleString()}</div>
                    </div>
                </div>
                <div class="pt-1.5 space-y-1.5 text-sm sm:text-base">
                    <div><strong>變更類型：</strong><span class="text-purple-900 font-bold ml-1">${reasonType || '未指定'}</span></div>
                    <div><strong>變更理由與效益：</strong><br><span class="text-slate-800 bg-white p-2.5 rounded-xl block mt-1 border border-purple-200 font-normal text-sm">${reason}</span></div>
                </div>
            `;
            supervisorComment.value = "";
            reviewModal.classList.remove('hidden');
        }

        closeReviewModal.addEventListener('click', () => reviewModal.classList.add('hidden'));

        async function submitReviewDecision(decision) {
            if (!currentActiveRowIndex) return;
            const comment = supervisorComment.value.trim();
            if (!comment) {
                showCustomMessage("請務必填寫「主管審核評語 / 意見說明」後再送出審核！", "欄位必填提示");
                supervisorComment.focus();
                return;
            }
            const supervisor = reviewSupervisorSelect.value;
            const roleType = reviewRoleSelect.value;

            approveActionBtn.disabled = true;
            rejectActionBtn.disabled = true;

            const payload = {
                action: "review",
                rowIndex: currentActiveRowIndex,
                decision: decision,
                supervisorName: supervisor,
                reviewerRole: roleType,
                comment: comment
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                showCustomMessage(`審核結果已成功儲存：[${decision}]`, "審核完成");
                reviewModal.classList.add('hidden');
                fetchPendingBtn.click();
            } catch (err) {
                console.error(err);
                showCustomMessage("送出審核結果時發生錯誤。", "錯誤");
            } finally {
                approveActionBtn.disabled = false;
                rejectActionBtn.disabled = false;
            }
        }

        approveActionBtn.addEventListener('click', () => submitReviewDecision("核准"));
        rejectActionBtn.addEventListener('click', () => submitReviewDecision("退件"));
    </script>
</body>
</html>
