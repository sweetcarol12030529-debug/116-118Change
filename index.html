<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康台灣深耕計畫 - 經費變更申請系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #6b21a8 0%, #7c3aed 50%, #9333ea 100%);
            min-height: 100vh;
            font-size: 20px; /* 基礎字型大小設定至少為 20px */
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        /* 確保字體加大後內容不溢出且能自動換行 */
        select, input, textarea, button, div, span, p, label {
            word-break: break-word;
            overflow-wrap: break-word;
        }
        select option {
            font-size: 18px;
            padding: 8px;
        }
    </style>
</head>
<body class="text-slate-800 antialiased py-8 px-3 sm:px-6 lg:px-8 text-xl">

    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-10">
            <div class="inline-flex items-center justify-center p-4 bg-white/20 rounded-full shadow-lg mb-4 text-white animate-pulse">
                <i class="fa-solid fa-file-invoice-dollar text-4xl"></i>
            </div>
            <h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight drop-shadow-md">
                健康台灣深耕計畫
            </h1>
            <p class="text-purple-100 text-xl sm:text-2xl mt-3 font-medium">經費變更線上申請系統</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-6">
                <div class="glass-card rounded-3xl shadow-2xl p-6 sm:p-8">
                    <div class="flex flex-wrap items-center justify-between border-b border-purple-100 pb-4 mb-6 gap-2">
                        <h2 class="text-2xl sm:text-3xl font-bold text-purple-900 flex items-center gap-3">
                            <i class="fa-solid fa-pen-to-square text-purple-600"></i>
                            填寫經費變更申請表
                        </h2>
                        <span class="px-3 py-1 bg-emerald-100 text-emerald-800 text-lg font-bold rounded-full uppercase tracking-wider">連線穩定</span>
                    </div>

                    <form id="budgetForm" class="space-y-8">
                        
                        <!-- Outflow Section -->
                        <div class="p-6 rounded-2xl bg-rose-50/90 border border-rose-200/80 shadow-sm space-y-5">
                            <h3 class="font-bold text-rose-900 flex items-center gap-2 text-2xl">
                                <i class="fa-solid fa-circle-minus text-rose-600"></i> 經費流出項目 (來源)
                            </h3>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-xl font-bold text-rose-950 mb-2">流出範疇 <span class="text-rose-600">*</span></label>
                                    <select id="fromCategorySelect" required class="w-full rounded-xl border-2 border-rose-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-rose-500 font-medium">
                                        <option value="">請選擇範疇...</option>
                                        <option value="範疇一">範疇一</option>
                                        <option value="範疇二">範疇二</option>
                                        <option value="範疇三">範疇三</option>
                                        <option value="範疇四">範疇四</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xl font-bold text-rose-950 mb-2">流出子計畫名稱 <span class="text-rose-600">*</span></label>
                                    <select id="fromSubProjectSelect" required class="w-full rounded-xl border-2 border-rose-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-rose-500 font-medium leading-tight">
                                        <option value="">請先選擇範疇...</option>
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
                                <div>
                                    <label class="block text-xl font-bold text-rose-950 mb-2">經費來源 <span class="text-rose-600">*</span></label>
                                    <select id="fromSource" required class="w-full rounded-xl border-2 border-rose-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-rose-500 font-medium">
                                        <option value="">請選擇...</option>
                                        <option value="補助款">補助款</option>
                                        <option value="機構配合款">機構配合款</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xl font-bold text-rose-950 mb-2">門別 <span class="text-rose-600">*</span></label>
                                    <select id="fromCategory" required class="w-full rounded-xl border-2 border-rose-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-rose-500 font-medium">
                                        <option value="">請選擇...</option>
                                        <option value="經常門">經常門</option>
                                        <option value="資本門">資本門</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xl font-bold text-rose-950 mb-2">項目名稱 <span class="text-rose-600">*</span></label>
                                    <select id="fromItem" required class="w-full rounded-xl border-2 border-rose-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-rose-500 font-medium">
                                        <option value="">請先選擇門別...</option>
                                    </select>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-xl font-bold text-rose-950 mb-2">流出細項名稱 <span class="text-rose-600">*</span></label>
                                    <select id="fromDetail" required class="w-full rounded-xl border-2 border-rose-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-rose-500 font-medium">
                                        <option value="">請先選擇項目名稱...</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xl font-bold text-rose-950 mb-2">流出金額 (NT$) <span class="text-rose-600">*</span></label>
                                    <input type="number" id="fromAmount" required min="1" placeholder="0" class="w-full rounded-xl border-2 border-rose-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-rose-500 font-extrabold text-rose-700">
                                </div>
                            </div>
                        </div>

                        <!-- Inflow Section -->
                        <div class="p-6 rounded-2xl bg-emerald-50/90 border border-emerald-200/80 shadow-sm space-y-5">
                            <h3 class="font-bold text-emerald-900 flex items-center gap-2 text-2xl">
                                <i class="fa-solid fa-circle-plus text-emerald-600"></i> 流用至經費項目 (去處)
                            </h3>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-xl font-bold text-emerald-950 mb-2">流入範疇 <span class="text-emerald-600">*</span></label>
                                    <select id="toCategorySelect" required class="w-full rounded-xl border-2 border-emerald-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-emerald-500 font-medium">
                                        <option value="">請選擇範疇...</option>
                                        <option value="範疇一">範疇一</option>
                                        <option value="範疇二">範疇二</option>
                                        <option value="範疇三">範疇三</option>
                                        <option value="範疇四">範疇四</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xl font-bold text-emerald-950 mb-2">流入子計畫名稱 <span class="text-emerald-600">*</span></label>
                                    <select id="toSubProjectSelect" required class="w-full rounded-xl border-2 border-emerald-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-emerald-500 font-medium leading-tight">
                                        <option value="">請先選擇範疇...</option>
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
                                <div>
                                    <label class="block text-xl font-bold text-emerald-950 mb-2">流至經費 <span class="text-emerald-600">*</span></label>
                                    <select id="toSource" required class="w-full rounded-xl border-2 border-emerald-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-emerald-500 font-medium">
                                        <option value="">請選擇...</option>
                                        <option value="補助款">補助款</option>
                                        <option value="機構配合款">機構配合款</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xl font-bold text-emerald-950 mb-2">門別 <span class="text-emerald-600">*</span></label>
                                    <select id="toCategory" required class="w-full rounded-xl border-2 border-emerald-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-emerald-500 font-medium">
                                        <option value="">請選擇...</option>
                                        <option value="經常門">經常門</option>
                                        <option value="資本門">資本門</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xl font-bold text-emerald-950 mb-2">項目名稱 <span class="text-emerald-600">*</span></label>
                                    <select id="toItem" required class="w-full rounded-xl border-2 border-emerald-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-emerald-500 font-medium">
                                        <option value="">請先選擇門別...</option>
                                    </select>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-xl font-bold text-emerald-950 mb-2">流用細項名稱 <span class="text-emerald-600">*</span></label>
                                    <select id="toDetail" required class="w-full rounded-xl border-2 border-emerald-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-emerald-500 font-medium">
                                        <option value="">請先選擇項目名稱...</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xl font-bold text-emerald-950 mb-2">流用金額 (NT$) <span class="text-emerald-600">*</span></label>
                                    <input type="number" id="toAmount" required min="1" placeholder="0" class="w-full rounded-xl border-2 border-emerald-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-emerald-500 font-extrabold text-emerald-700">
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xl font-bold text-purple-950 mb-2">申請變更理由與效益說明 <span class="text-purple-600">*</span></label>
                            <textarea id="reason" required rows="4" placeholder="請詳細敘述經費變更之必要性及預期效益..." class="w-full rounded-xl border-2 border-purple-200 bg-purple-50/50 p-4 text-xl text-slate-800 focus:ring-2 focus:ring-purple-500 focus:outline-none transition font-medium"></textarea>
                        </div>

                        <div class="p-6 rounded-2xl bg-indigo-50/90 border border-indigo-200/80 shadow-sm space-y-5">
                            <h3 class="font-bold text-indigo-950 flex items-center gap-2 text-2xl">
                                <i class="fa-solid fa-file-signature text-indigo-600"></i> 簽核架構設定
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-xl font-bold text-indigo-950 mb-2">申請人姓名 <span class="text-indigo-600">*</span></label>
                                    <input type="text" id="applicantName" required placeholder="請輸入填單申請人姓名" class="w-full rounded-xl border-2 border-indigo-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-indigo-500 font-medium">
                                </div>
                                <div>
                                    <label class="block text-xl font-bold text-indigo-950 mb-2">審核主管 / 子計畫負責人 <span class="text-indigo-600">*</span></label>
                                    <select id="approverName" required class="w-full rounded-xl border-2 border-indigo-200 bg-white p-3 text-xl text-slate-800 focus:ring-2 focus:ring-indigo-500 font-medium">
                                        <option value="">請先選擇流出範疇...</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div id="ruleAlert" class="hidden p-5 rounded-2xl text-xl font-bold"></div>

                        <div class="flex flex-col sm:flex-row gap-5 pt-3">
                            <button type="button" id="validateBtn" class="flex-1 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-extrabold py-4 px-6 rounded-2xl shadow-lg transition flex items-center justify-center gap-3 cursor-pointer text-xl">
                                <i class="fa-solid fa-shield-halved text-2xl"></i> 執行法規檢核
                            </button>
                            <button type="submit" id="submitBtn" disabled class="flex-1 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-extrabold py-4 px-6 rounded-2xl shadow-lg opacity-50 cursor-not-allowed transition flex items-center justify-center gap-3 text-xl">
                                <i class="fa-solid fa-paper-plane text-2xl"></i> 提交變更申請並寄信
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Summary Sidebar -->
            <div class="space-y-6">
                <div class="glass-card rounded-3xl shadow-2xl p-6 sm:p-8 sticky top-8">
                    <h3 class="text-2xl font-bold text-purple-950 mb-5 flex items-center gap-3">
                        <i class="fa-solid fa-clock-rotate-left text-purple-600"></i> 本次申請摘要
                    </h3>
                    <div id="summaryContent" class="space-y-4 text-xl text-slate-700">
                        <p class="italic text-slate-400 font-medium">尚未填寫完整或尚未執行檢核...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxy6nsJ_heTEtRmnHeAN6jMnWTiZx2c4E5wXw-vmIqIgBMiAyCqyxk0zLUzdGqV8-n5/exec";

        function showCustomMessage(message, title = "系統提示") {
            const m = document.createElement('div');
            m.className = "fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 text-xl";
            m.innerHTML = `
                <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl text-center space-y-6">
                    <h3 class="text-2xl font-extrabold text-slate-800">${title}</h3>
                    <p class="text-xl text-slate-600 font-medium leading-relaxed">${message}</p>
                    <button id="closeMsgBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3.5 rounded-2xl transition cursor-pointer text-xl">確定</button>
                </div>
            `;
            document.body.appendChild(m);
            document.getElementById('closeMsgBtn').addEventListener('click', () => m.remove());
        }

        const approversByScope = {
            "範疇一": ["劉季惠", "蔡斗元", "唐家沛", "曾志恩", "林真福", "陳可家", "李紀慧"],
            "範疇二": ["陳弘美", "李宜恭"],
            "範疇三": ["黃智瑋", "林庭光"],
            "範疇四": ["葉明憲", "楊佳瑜", "鄭秀晶", "陳佳蓉", "陳敬森", "顏貴珍", "陳志偉", "劉鎮榮"]
        };

        const fromCategorySelect = document.getElementById('fromCategorySelect');
        const fromSubProjectSelect = document.getElementById('fromSubProjectSelect');
        const toCategorySelect = document.getElementById('toCategorySelect');
        const toSubProjectSelect = document.getElementById('toSubProjectSelect');
        const approverNameSelect = document.getElementById('approverName');
        const fromItem = document.getElementById('fromItem');
        const toItem = document.getElementById('toItem');
        const fromDetail = document.getElementById('fromDetail');
        const toDetail = document.getElementById('toDetail');
        const fromCategory = document.getElementById('fromCategory');
        const toCategory = document.getElementById('toCategory');
        const fromAmount = document.getElementById('fromAmount');
        const toAmount = document.getElementById('toAmount');
        const validateBtn = document.getElementById('validateBtn');
        const submitBtn = document.getElementById('submitBtn');
        const ruleAlert = document.getElementById('ruleAlert');
        const summaryContent = document.getElementById('summaryContent');
        const budgetForm = document.getElementById('budgetForm');

        fromCategorySelect.addEventListener('change', function() {
            const selectedCat = this.value;
            fromSubProjectSelect.innerHTML = '<option value="">請選擇子計畫...</option>';
            if (selectedCat && subProjectsData[selectedCat]) {
                subProjectsData[selectedCat].forEach(proj => {
                    const opt = document.createElement('option');
                    opt.value = proj;
                    opt.textContent = proj;
                    fromSubProjectSelect.appendChild(opt);
                });
            }
            approverNameSelect.innerHTML = '<option value="">請選擇審核主管/負責人...</option>';
            if (selectedCat && approversByScope[selectedCat]) {
                approversByScope[selectedCat].forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = `${selectedCat} - ${name}`;
                    approverNameSelect.appendChild(opt);
                });
            }
        });

        toCategorySelect.addEventListener('change', function() {
            const selectedCat = this.value;
            toSubProjectSelect.innerHTML = '<option value="">請選擇子計畫...</option>';
            if (selectedCat && subProjectsData[selectedCat]) {
                subProjectsData[selectedCat].forEach(proj => {
                    const opt = document.createElement('option');
                    opt.value = proj;
                    opt.textContent = proj;
                    toSubProjectSelect.appendChild(opt);
                });
            }
        });

        fromCategory.addEventListener('change', function() {
            const cat = this.value;
            fromItem.innerHTML = '<option value="">請選擇項目名稱...</option>';
            fromDetail.innerHTML = '<option value="">請先選擇項目名稱...</option>';
            if (cat === '經常門') {
                ['人事費', '業務費', '管理費'].forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.textContent = item;
                    fromItem.appendChild(opt);
                });
            } else if (cat === '資本門') {
                const opt = document.createElement('option');
                opt.value = '設備費';
                opt.textContent = '設備費';
                fromItem.appendChild(opt);
            }
        });

        toCategory.addEventListener('change', function() {
            const cat = this.value;
            toItem.innerHTML = '<option value="">請選擇項目名稱...</option>';
            toDetail.innerHTML = '<option value="">請先選擇項目名稱...</option>';
            if (cat === '經常門') {
                ['人事費', '業務費', '管理費'].forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.textContent = item;
                    toItem.appendChild(opt);
                });
            } else if (cat === '資本門') {
                const opt = document.createElement('option');
                opt.value = '設備費';
                opt.textContent = '設備費';
                toItem.appendChild(opt);
            }
        });

        fromItem.addEventListener('change', function() {
            const selectedItem = this.value;
            fromDetail.innerHTML = '<option value="">請選擇細項名稱...</option>';
            if (selectedItem && detailOptionsMap[selectedItem]) {
                detailOptionsMap[selectedItem].forEach(detail => {
                    const opt = document.createElement('option');
                    opt.value = detail;
                    opt.textContent = detail;
                    fromDetail.appendChild(opt);
                });
            }
        });

        toItem.addEventListener('change', function() {
            const selectedItem = this.value;
            toDetail.innerHTML = '<option value="">請選擇細項名稱...</option>';
            if (selectedItem && detailOptionsMap[selectedItem]) {
                detailOptionsMap[selectedItem].forEach(detail => {
                    const opt = document.createElement('option');
                    opt.value = detail;
                    opt.textContent = detail;
                    toDetail.appendChild(opt);
                });
            }
        });

        validateBtn.addEventListener('click', function() {
            if (!budgetForm.checkValidity()) {
                budgetForm.reportValidity();
                return;
            }

            const fCatName = fromCategorySelect.value;
            const fSubProj = fromSubProjectSelect.value;
            const tCatName = toCategorySelect.value;
            const tSubProj = toSubProjectSelect.value;
            const fItem = fromItem.value;
            const tItem = toItem.value;
            const fCat = fromCategory.value;
            const tCat = toCategory.value;
            const fVal = parseFloat(fromAmount.value) || 0;
            const tVal = parseFloat(toAmount.value) || 0;

            let errors = [];
            let warnings = [];

            if (tItem === '人事費') {
                errors.push("違規！人事費只能流出，絕對不能流入！");
            }
            if (fCat === '經常門' && tCat === '資本門') {
                errors.push("違規！經常門經費不能流入資本門！");
            }
            if (fVal <= 0 || tVal <= 0) {
                errors.push("流出與流入金額必須大於 0。");
            } else if (fVal !== tVal) {
                warnings.push("注意：流出金額與流入金額不相符，請確認經費平衡。");
            }

            ruleAlert.classList.remove('hidden');
            if (errors.length > 0) {
                ruleAlert.className = "p-5 rounded-2xl text-xl font-bold bg-rose-100 text-rose-900 border-2 border-rose-300 space-y-2";
                ruleAlert.innerHTML = `<div class="font-extrabold text-2xl flex items-center gap-2"><i class="fa-solid fa-circle-xmark text-rose-600"></i> 檢核未通過：</div><ul class="list-disc list-inside space-y-1">${errors.map(e => `<li>${e}</li>`).join('')}</ul>`;
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                ruleAlert.className = "p-5 rounded-2xl text-xl font-bold bg-emerald-100 text-emerald-900 border-2 border-emerald-300 space-y-1";
                ruleAlert.innerHTML = `<div class="font-extrabold text-2xl flex items-center gap-2"><i class="fa-solid fa-circle-check text-emerald-600"></i> 法規檢核通過！</div>${warnings.length > 0 ? `<p class="text-lg mt-1 font-semibold text-amber-800">${warnings[0]}</p>` : '<p class="text-lg mt-1 font-medium text-emerald-800">所有流用項目符合「健康台灣深耕計畫」規範。</p>'}`;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');

                summaryContent.innerHTML = `
                    <div class="space-y-4 bg-white/70 p-5 rounded-2xl border border-purple-200 text-lg leading-relaxed">
                        <div class="space-y-1">
                            <strong class="text-rose-800 text-xl flex items-center gap-2"><i class="fa-solid fa-circle-minus text-rose-600"></i> 經費流出項目：</strong>
                            <div class="pl-2 text-slate-800 space-y-1 mt-1">
                                <div><strong>流出子計畫：</strong> <span class="text-rose-900 font-bold">${fCatName} - ${fSubProj}</span></div>
                                <div><strong>細項名稱：</strong> <span class="font-bold text-rose-800 bg-rose-100 px-2 py-0.5 rounded border border-rose-200">${fromDetail.value}</span></div>
                                <div><strong>流出金額：</strong> <span class="font-extrabold text-rose-700 text-xl">$${fVal.toLocaleString()}</span></div>
                            </div>
                        </div>
                        <hr class="border-purple-200">
                        <div class="space-y-1">
                            <strong class="text-emerald-800 text-xl flex items-center gap-2"><i class="fa-solid fa-circle-plus text-emerald-600"></i> 流入經費項目：</strong>
                            <div class="pl-2 text-slate-800 space-y-1 mt-1">
                                <div><strong>流入子計畫：</strong> <span class="text-emerald-900 font-bold">${tCatName} - ${tSubProj}</span></div>
                                <div><strong>細項名稱：</strong> <span class="font-bold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded border border-emerald-200">${toDetail.value}</span></div>
                                <div><strong>流入金額：</strong> <span class="font-extrabold text-emerald-700 text-xl">$${tVal.toLocaleString()}</span></div>
                            </div>
                        </div>
                    </div>
                `;
            }
        });

        budgetForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-2xl"></i> 正在傳送至後端與寄信...`;

            const payload = {
                action: "submit",
                fromCategoryScope: fromCategorySelect.value,
                fromSubProject: fromSubProjectSelect.value,
                toCategoryScope: toCategorySelect.value,
                toSubProject: toSubProjectSelect.value,
                fromSource: document.getElementById('fromSource').value,
                fromCategory: fromCategory.value,
                fromItem: fromItem.value,
                fromDetail: fromDetail.value,
                fromAmount: fromAmount.value,
                toSource: document.getElementById('toSource').value,
                toCategory: toCategory.value,
                toItem: toItem.value,
                toDetail: toDetail.value,
                toAmount: toAmount.value,
                reason: document.getElementById('reason').value,
                applicantName: document.getElementById('applicantName').value,
                approverName: approverNameSelect.value
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                showSuccessModal(payload.approverName);
            } catch (err) {
                console.error(err);
                showCustomMessage("送出時發生網路錯誤，請檢查連線或稍後再試。", "錯誤");
            } finally {
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane text-2xl"></i> 提交變更申請並寄信`;
            }
        });

        function showSuccessModal(approverName) {
            const modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 text-xl";
            modal.innerHTML = `
                <div class="bg-white rounded-3xl p-8 max-w-lg w-full shadow-2xl text-center space-y-6">
                    <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-4xl">
                        <i class="fa-solid fa-paper-plane"></i>
                    </div>
                    <h3 class="text-3xl font-extrabold text-slate-900">變更申請已成功送出！</h3>
                    <p class="text-xl text-slate-700 leading-relaxed font-medium">資料已寫入系統，並已發送通知信給主管 <strong class="text-purple-800 font-extrabold">${approverName}</strong> 前往專屬審核網頁。</p>
                    <button id="closeModal" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-extrabold py-4 rounded-2xl shadow-lg transition cursor-pointer text-xl">確定</button>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('closeModal').addEventListener('click', () => {
                modal.remove();
                budgetForm.reset();
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                ruleAlert.classList.add('hidden');
                summaryContent.innerHTML = '<p class="italic text-slate-400 font-medium">尚未填寫完整或尚未執行檢核...</p>';
            });
        }
    </script>
