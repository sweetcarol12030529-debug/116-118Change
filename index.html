<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康台灣深耕計畫經費變更申請與審核系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #6b21a8 0%, #7c3aed 50%, #9333ea 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="text-slate-800 antialiased py-8 px-4 sm:px-6 lg:px-8">

    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-10">
            <div class="inline-flex items-center justify-center p-3 bg-white/20 rounded-full shadow-lg mb-4 text-white animate-pulse">
                <i class="fa-solid fa-file-invoice-dollar text-3xl"></i>
            </div>
            <h1 class="text-4xl sm:text-5xl font-extrabold text-white tracking-tight drop-shadow-md">
                健康台灣深耕計畫
            </h1>
            <p class="text-purple-100 text-lg mt-2 font-medium">經費變更申請與主管審核管理系統</p>
        </header>

        <div class="flex justify-center mb-8">
            <div class="bg-white/20 backdrop-blur-md p-1.5 rounded-2xl flex gap-2 shadow-lg">
                <button id="tabApplyBtn" class="px-6 py-2.5 rounded-xl font-bold text-white bg-purple-700 shadow-md transition flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-pen-to-square"></i> 填寫經費變更申請
                </button>
                <button id="tabReviewBtn" class="px-6 py-2.5 rounded-xl font-bold text-purple-200 hover:text-white hover:bg-white/10 transition flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-clipboard-check"></i> 主管審核操作區
                </button>
            </div>
        </div>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div id="applicationSection" class="lg:col-span-3 space-y-6">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- Form Container (2 cols) -->
                    <div class="lg:col-span-2 space-y-6">
                        <div class="glass-card rounded-3xl shadow-2xl p-6 sm:p-8">
                            <div class="flex items-center justify-between border-b border-purple-100 pb-4 mb-6">
                                <h2 class="text-2xl font-bold text-purple-900 flex items-center gap-3">
                                    <i class="fa-solid fa-file-invoice-dollar text-purple-600"></i>
                                    經費流用與變更申請表
                                </h2>
                                <span class="px-3 py-1 bg-emerald-100 text-emerald-700 text-xs font-semibold rounded-full uppercase tracking-wider">連線穩定</span>
                            </div>

                            <form id="budgetForm" class="space-y-6">
                                
                                <!-- Outflow Section -->
                                <div class="p-5 rounded-2xl bg-rose-50/80 border border-rose-200/60 shadow-sm space-y-4">
                                    <h3 class="font-bold text-rose-800 flex items-center gap-2 text-lg">
                                        <i class="fa-solid fa-circle-minus text-rose-600"></i> 經費流出項目 (來源)
                                    </h3>
                                    
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-semibold text-rose-900 mb-1">流出範疇 <span class="text-rose-500">*</span></label>
                                            <select id="fromCategorySelect" required class="w-full rounded-lg border-rose-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-rose-500">
                                                <option value="">請選擇範疇...</option>
                                                <option value="範疇一">範疇一</option>
                                                <option value="範疇二">範疇二</option>
                                                <option value="範疇三">範疇三</option>
                                                <option value="範疇四">範疇四</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-rose-900 mb-1">流出子計畫名稱 <span class="text-rose-500">*</span></label>
                                            <select id="fromSubProjectSelect" required class="w-full rounded-lg border-rose-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-rose-500">
                                                <option value="">請先選擇範疇...</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div>
                                            <label class="block text-xs font-semibold text-rose-900 mb-1">經費來源 <span class="text-rose-500">*</span></label>
                                            <select id="fromSource" required class="w-full rounded-lg border-rose-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-rose-500">
                                                <option value="">請選擇...</option>
                                                <option value="補助款">補助款</option>
                                                <option value="機構配合款">機構配合款</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-rose-900 mb-1">門別 <span class="text-rose-500">*</span></label>
                                            <select id="fromCategory" required class="w-full rounded-lg border-rose-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-rose-500">
                                                <option value="">請選擇...</option>
                                                <option value="經常門">經常門</option>
                                                <option value="資本門">資本門</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-rose-900 mb-1">項目名稱 <span class="text-rose-500">*</span></label>
                                            <select id="fromItem" required class="w-full rounded-lg border-rose-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-rose-500">
                                                <option value="">請先選擇門別...</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-semibold text-rose-900 mb-1">流出細項名稱 (G欄對應) <span class="text-rose-500">*</span></label>
                                            <select id="fromDetail" required class="w-full rounded-lg border-rose-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-rose-500">
                                                <option value="">請先選擇項目名稱...</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-rose-900 mb-1">流出金額 (NT$) <span class="text-rose-500">*</span></label>
                                            <input type="number" id="fromAmount" required min="1" placeholder="0" class="w-full rounded-lg border-rose-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-rose-500 font-bold text-rose-600">
                                        </div>
                                    </div>
                                </div>

                                <!-- Inflow Section -->
                                <div class="p-5 rounded-2xl bg-emerald-50/80 border border-emerald-200/60 shadow-sm space-y-4">
                                    <h3 class="font-bold text-emerald-800 flex items-center gap-2 text-lg">
                                        <i class="fa-solid fa-circle-plus text-emerald-600"></i> 流用至經費項目 (去處)
                                    </h3>
                                    
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-semibold text-emerald-900 mb-1">流入範疇 <span class="text-emerald-500">*</span></label>
                                            <select id="toCategorySelect" required class="w-full rounded-lg border-emerald-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-emerald-500">
                                                <option value="">請選擇範疇...</option>
                                                <option value="範疇一">範疇一</option>
                                                <option value="範疇二">範疇二</option>
                                                <option value="範疇三">範疇三</option>
                                                <option value="範疇四">範疇四</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-emerald-900 mb-1">流入子計畫名稱 <span class="text-emerald-500">*</span></label>
                                            <select id="toSubProjectSelect" required class="w-full rounded-lg border-emerald-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-emerald-500">
                                                <option value="">請先選擇範疇...</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div>
                                            <label class="block text-xs font-semibold text-emerald-900 mb-1">流至經費 <span class="text-emerald-500">*</span></label>
                                            <select id="toSource" required class="w-full rounded-lg border-emerald-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-emerald-500">
                                                <option value="">請選擇...</option>
                                                <option value="補助款">補助款</option>
                                                <option value="機構配合款">機構配合款</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-emerald-900 mb-1">門別 <span class="text-emerald-500">*</span></label>
                                            <select id="toCategory" required class="w-full rounded-lg border-emerald-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-emerald-500">
                                                <option value="">請選擇...</option>
                                                <option value="經常門">經常門</option>
                                                <option value="資本門">資本門</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-emerald-900 mb-1">項目名稱 <span class="text-emerald-500">*</span></label>
                                            <select id="toItem" required class="w-full rounded-lg border-emerald-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-emerald-500">
                                                <option value="">請先選擇門別...</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-semibold text-emerald-900 mb-1">流用細項名稱 (L欄對應) <span class="text-emerald-500">*</span></label>
                                            <select id="toDetail" required class="w-full rounded-lg border-emerald-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-emerald-500">
                                                <option value="">請先選擇項目名稱...</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-emerald-900 mb-1">流用金額 (NT$) <span class="text-emerald-500">*</span></label>
                                            <input type="number" id="toAmount" required min="1" placeholder="0" class="w-full rounded-lg border-emerald-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-emerald-500 font-bold text-emerald-600">
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <label class="block text-sm font-semibold text-purple-900 mb-2">申請變更理由與效益說明 <span class="text-purple-600">*</span></label>
                                    <textarea id="reason" required rows="3" placeholder="請詳細敘述經費變更之必要性及預期效益..." class="w-full rounded-xl border-purple-200 bg-purple-50/50 p-3 text-slate-700 focus:ring-2 focus:ring-purple-500 focus:outline-none transition"></textarea>
                                </div>

                                <div class="p-5 rounded-2xl bg-indigo-50/80 border border-indigo-200/60 shadow-sm space-y-4">
                                    <h3 class="font-bold text-indigo-800 flex items-center gap-2 text-lg">
                                        <i class="fa-solid fa-file-signature text-indigo-600"></i> 簽核架構設定 (申請人填單 ➔ 指定主管審核與寄信)
                                    </h3>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-semibold text-indigo-900 mb-1">申請人姓名 <span class="text-indigo-500">*</span></label>
                                            <input type="text" id="applicantName" required placeholder="請輸入填單申請人姓名" class="w-full rounded-lg border-indigo-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-indigo-500">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-indigo-900 mb-1">審核主管 / 子計畫負責人 <span class="text-indigo-500">*</span></label>
                                            <select id="approverName" required class="w-full rounded-lg border-indigo-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-indigo-500">
                                                <option value="">請先選擇流出範疇...</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <div id="ruleAlert" class="hidden p-4 rounded-xl text-sm font-medium"></div>

                                <div class="flex flex-col sm:flex-row gap-4 pt-2">
                                    <button type="button" id="validateBtn" class="flex-1 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg hover:from-amber-600 hover:to-orange-600 transition flex items-center justify-center gap-2 cursor-pointer">
                                        <i class="fa-solid fa-shield-halved"></i> 執行法規檢核
                                    </button>
                                    <button type="submit" id="submitBtn" disabled class="flex-1 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg opacity-50 cursor-not-allowed transition flex items-center justify-center gap-2">
                                        <i class="fa-solid fa-paper-plane"></i> 提交變更申請並寄信
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Summary Sidebar -->
                    <div class="space-y-6">
                        <div class="glass-card rounded-3xl shadow-2xl p-6">
                            <h3 class="text-xl font-bold text-purple-900 mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-clock-rotate-left text-purple-600"></i> 本次申請摘要
                            </h3>
                            <div id="summaryContent" class="space-y-3 text-sm text-slate-600">
                                <p class="italic text-slate-400">尚未填寫完整或尚未執行檢核...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="reviewSection" class="lg:col-span-3 space-y-6 hidden">
                <div class="glass-card rounded-3xl shadow-2xl p-6 sm:p-8">
                    <div class="flex items-center justify-between border-b border-purple-100 pb-4 mb-6">
                        <h2 class="text-2xl font-bold text-purple-900 flex items-center gap-3">
                            <i class="fa-solid fa-clipboard-check text-purple-600"></i> 主管 / 計畫負責人審核操作專區
                        </h2>
                        <span class="px-3 py-1 bg-purple-100 text-purple-700 text-xs font-semibold rounded-full uppercase tracking-wider">密碼驗證</span>
                    </div>

                    <div class="space-y-6">
                        <div class="p-5 rounded-2xl bg-purple-50/80 border border-purple-200/60 shadow-sm space-y-4">
                            <h3 class="font-bold text-purple-900 text-base flex items-center gap-2">
                                <i class="fa-solid fa-lock"></i> 選擇主管身分並輸入驗證密碼
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-purple-900 mb-1">選擇主管身分 / 負責人 <span class="text-purple-500">*</span></label>
                                    <select id="reviewSupervisorSelect" class="w-full rounded-lg border-purple-200 bg-white p-2.5 text-sm text-slate-700 focus:ring-2 focus:ring-purple-500">
                                        <option value="">請選擇您的主管身分...</option>
                                        <optgroup label="範疇一">
                                            <option value="劉季惠">劉季惠</option><option value="蔡斗元">蔡斗元</option><option value="唐家沛">唐家沛</option><option value="曾志恩">曾志恩</option><option value="林真福">林真福</option><option value="陳可家">陳可家</option><option value="李紀慧">李紀慧</option>
                                        </optgroup>
                                        <optgroup label="範疇二">
                                            <option value="陳弘美">陳弘美</option><option value="李宜恭">李宜恭</option>
                                        </optgroup>
                                        <optgroup label="範疇三">
                                            <option value="黃智瑋">黃智瑋</option><option value="林庭光">林庭光</option>
                                        </optgroup>
                                        <optgroup label="範疇四">
                                            <option value="葉明憲">葉明憲</option><option value="楊佳瑜">楊佳瑜</option><option value="鄭秀晶">鄭秀晶</option><option value="陳佳蓉">陳佳蓉</option><option value="陳敬森">陳敬森</option><option value="顏貴珍">顏貴珍</option><option value="陳志偉">陳志偉</option><option value="劉鎮榮">劉鎮榮</option>
                                        </optgroup>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-purple-900 mb-1">輸入專屬安全密碼 <span class="text-purple-500">*</span></label>
                                    <div class="relative">
                                        <input type="password" id="reviewPinInput" placeholder="請輸入主管密碼" class="w-full rounded-lg border-purple-200 bg-white p-2.5 pr-10 text-sm text-slate-700 focus:ring-2 focus:ring-purple-500">
                                        <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-purple-700 cursor-pointer">
                                            <i id="togglePasswordIcon" class="fa-solid fa-eye-slash"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="flex items-end">
                                    <button type="button" id="fetchPendingBtn" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold py-2.5 px-4 rounded-lg shadow transition flex items-center justify-center gap-2 text-sm cursor-pointer">
                                        <i class="fa-solid fa-rotate"></i> 驗證並載入待審清單
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Pending Cases Container -->
                        <div id="pendingCasesContainer" class="space-y-4">
                            <div class="text-center py-8 text-slate-400 bg-white/50 rounded-2xl border border-purple-100">
                                <i class="fa-solid fa-inbox text-3xl mb-2 text-purple-300"></i>
                                <p class="text-sm">請先選擇主管身分並輸入對應密碼以查詢案件。</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <div id="reviewModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-xl w-full shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-purple-100 pb-3">
                <h3 class="text-xl font-bold text-purple-900 flex items-center gap-2">
                    <i class="fa-solid fa-signature text-purple-600"></i> 審核表單覆核作業
                </h3>
                <button id="closeReviewModal" class="text-slate-400 hover:text-slate-600 text-lg font-bold cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="reviewModalDetails" class="space-y-2 text-sm text-slate-600 bg-purple-50 p-4 rounded-xl border border-purple-100 max-h-[60vh] overflow-y-auto">
                <!-- Dynamic Review Details -->
            </div>
            <div>
                <label class="block text-xs font-semibold text-purple-900 mb-1">主管審核評語 / 意見說明</label>
                <textarea id="supervisorComment" rows="3" placeholder="請填寫審核意見（若退件請務必說明原因）..." class="w-full rounded-xl border-purple-200 bg-purple-50/50 p-3 text-slate-700 focus:ring-2 focus:ring-purple-500 focus:outline-none transition text-sm"></textarea>
            </div>
            <div class="flex gap-4 pt-2">
                <button type="button" id="rejectActionBtn" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm cursor-pointer">
                    <i class="fa-solid fa-circle-xmark"></i> 退件 (Reject)
                </button>
                <button type="button" id="approveActionBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm cursor-pointer">
                    <i class="fa-solid fa-circle-check"></i> 核准 (Approve)
                </button>
            </div>
        </div>
    </div>

    <script>
        // Apps Script Web App URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxy6nsJ_heTEtRmnHeAN6jMnWTiZx2c4E5wXw-vmIqIgBMiAyCqyxk0zLUzdGqV8-n5/exec";

        function showCustomMessage(message, title = "系統提示") {
            const m = document.createElement('div');
            m.className = "fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4";
            m.innerHTML = `
                <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4">
                    <h3 class="text-xl font-bold text-slate-800">${title}</h3>
                    <p class="text-sm text-slate-600">${message}</p>
                    <button id="closeMsgBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-xl transition cursor-pointer">確定</button>
                </div>
            `;
            document.body.appendChild(m);
            document.getElementById('closeMsgBtn').addEventListener('click', () => m.remove());
        }

        const subProjectsData = {
            "範疇一": [

            }
            if (!pin) {
                showCustomMessage("請輸入您的專屬安全密碼！", "警告");
                return;
            }

            pendingCasesContainer.innerHTML = `<div class="text-center py-8 text-purple-600 bg-white/50 rounded-2xl border border-purple-100"><i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i><p class="text-sm">正在驗證密碼並載入待審清單...</p></div>`;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getPending&supervisor=${encodeURIComponent(supervisor)}&pin=${encodeURIComponent(pin)}`);
                const data = await res.json();

                if (data.status === "success") {
                    const cases = data.cases || [];
                    if (cases.length === 0) {
                        pendingCasesContainer.innerHTML = `
                            <div class="text-center py-8 text-slate-400 bg-white/50 rounded-2xl border border-purple-100">
                                <i class="fa-solid fa-circle-check text-3xl mb-2 text-emerald-500"></i>
                                <p class="text-sm font-medium">密碼驗證成功！目前沒有屬於「${supervisor}」主管的待審核案件。</p>
                            </div>
                        `;
                        return;
                    }

                    let html = `<div class="p-3 bg-emerald-50 text-emerald-800 text-xs font-bold rounded-xl border border-emerald-200 mb-2"><i class="fa-solid fa-shield-check"></i> 密碼驗證成功！目前顯示屬於「${supervisor}」的待審核案件：</div>`;
                    cases.forEach(item => {
                        html += `
                            <div class="bg-white p-5 rounded-2xl border border-purple-100 shadow-sm flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                                <div class="space-y-2 flex-1">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="px-2.5 py-0.5 bg-purple-100 text-purple-700 text-xs font-bold rounded">列次 #${item.rowIndex}</span>
                                        <span class="text-xs text-slate-400">${item.timestamp}</span>
                                        <span class="px-2.5 py-0.5 bg-amber-100 text-amber-800 text-xs font-bold rounded">${item.status}</span>
                                        <span class="text-xs font-semibold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded">申請人：${item.applicantName}</span>
                                    </div>
                                    
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-purple-50/60 p-3 rounded-xl border border-purple-100 text-xs">
                                        <div class="space-y-1">
                                            <span class="font-bold text-rose-700 flex items-center gap-1"><i class="fa-solid fa-circle-minus"></i> 經費流出 (子計畫與G欄)：</span>
                                            <p class="text-rose-900 font-bold bg-rose-50 p-1 rounded">流出子計畫：${item.fromSubProject || '未記錄'}</p>
                                            <p class="text-slate-700"><strong>${item.fromSource}</strong> | ${item.fromCategory} - ${item.fromItem}</p>
                                            <p class="text-rose-900 bg-rose-100/70 p-1.5 rounded border border-rose-200">流出細項名稱：<strong class="text-rose-950">${item.fromDetail || '無'}</strong></p>
                                            <p class="font-bold text-rose-600">金額：$${Number(item.fromAmount).toLocaleString()}</p>
                                        </div>
                                        <div class="space-y-1 border-t md:border-t-0 md:border-l border-purple-200 pt-2 md:pt-0 md:pl-3">
                                            <span class="font-bold text-emerald-700 flex items-center gap-1"><i class="fa-solid fa-circle-plus"></i> 經費流入 (子計畫與L欄)：</span>
                                            <p class="text-emerald-900 font-bold bg-emerald-50 p-1 rounded">流入子計畫：${item.toSubProject || '未記錄'}</p>
                                            <p class="text-slate-700"><strong>${item.toSource}</strong> | ${item.toCategory} - ${item.toItem}</p>
                                            <p class="text-emerald-900 bg-emerald-100/70 p-1.5 rounded border border-emerald-200">流入細項名稱：<strong class="text-emerald-950">${item.toDetail || '無'}</strong></p>
                                            <p class="font-bold text-emerald-600">金額：$${Number(item.toAmount).toLocaleString()}</p>
                                        </div>
                                    </div>

                                    <p class="text-xs text-slate-600"><strong>變更理由：</strong> ${item.reason}</p>
                                </div>
                                <button type="button" onclick="openReviewModal(${item.rowIndex}, '${item.applicantName}', '${item.reason.replace(/'/g, "\\'")}', '${item.fromSubProject || ''}', '${item.fromSource}', '${item.fromCategory}', '${item.fromItem}', '${item.fromDetail}', '${item.fromAmount}', '${item.toSubProject || ''}', '${item.toSource}', '${item.toCategory}', '${item.toItem}', '${item.toDetail}', '${item.toAmount}')" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-5 rounded-xl text-sm shadow transition flex items-center gap-2 whitespace-nowrap cursor-pointer self-end lg:self-center">
                                    <i class="fa-solid fa-pen-nib"></i> 進行審核
                                </button>
                            </div>
                        `;
                    });
                    pendingCasesContainer.innerHTML = html;
                } else {
                    pendingCasesContainer.innerHTML = `<div class="p-4 text-rose-700 text-sm bg-rose-50 rounded-xl border border-rose-200 font-medium"><i class="fa-solid fa-circle-xmark"></i> 驗證失敗：${data.message}</div>`;
                }
            } catch (err) {
                console.error(err);
                pendingCasesContainer.innerHTML = `<div class="p-4 text-rose-600 text-sm bg-rose-50 rounded-xl">連線錯誤，無法載入清單。</div>`;
            }
        });

        window.openReviewModal = function(rowIndex, applicant, reason, fSubProj, fSource, fCat, fItem, fDetail, fromAmt, tSubProj, tSource, tCat, tItem, tDetail, toAmt) {
            currentActiveRowIndex = rowIndex;
            reviewModalDetails.innerHTML = `
                <div class="grid grid-cols-2 gap-2 pb-2 border-b border-purple-200">
                    <div><strong>列次：</strong> #${rowIndex}</div>
                    <div><strong>申請人：</strong> ${applicant}</div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 py-2">
                    <div class="bg-rose-50 p-3 rounded-xl border border-rose-200 space-y-1.5">
                        <span class="font-bold text-rose-800 text-xs flex items-center gap-1"><i class="fa-solid fa-circle-minus"></i> 流出項目 (子計畫與G欄)：</span>
                        <div class="text-xs bg-rose-100/70 p-1 rounded font-bold text-rose-900">流出子計畫：${fSubProj || '未記錄'}</div>
                        <div class="text-xs text-slate-700"><strong>${fSource}</strong> | ${fCat} - ${fItem}</div>
                        <div class="text-xs bg-rose-100/80 p-1.5 rounded-lg border border-rose-200 text-rose-900">細項名稱：<strong class="text-rose-950">${fDetail || '無'}</strong></div>
                        <div class="font-bold text-rose-600 text-xs pt-0.5">金額：$${Number(fromAmt).toLocaleString()}</div>
                    </div>
                    <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-200 space-y-1.5">
                        <span class="font-bold text-emerald-800 text-xs flex items-center gap-1"><i class="fa-solid fa-circle-plus"></i> 流入項目 (子計畫與L欄)：</span>
                        <div class="text-xs bg-emerald-100/70 p-1 rounded font-bold text-emerald-900">流入子計畫：${tSubProj || '未記錄'}</div>
                        <div class="text-xs text-slate-700"><strong>${tSource}</strong> | ${tCat} - ${tItem}</div>
                        <div class="text-xs bg-emerald-100/80 p-1.5 rounded-lg border border-emerald-200 text-emerald-900">細項名稱：<strong class="text-emerald-950">${tDetail || '無'}</strong></div>
                        <div class="font-bold text-emerald-600 text-xs pt-0.5">金額：$${Number(toAmt).toLocaleString()}</div>
                    </div>
                </div>
                <div class="pt-1"><strong>變更理由與效益：</strong><br><span class="text-slate-700 bg-white p-2.5 rounded-xl block mt-1 border border-purple-100">${reason}</span></div>
            `;
            supervisorComment.value = "";
            reviewModal.classList.remove('hidden');
        }

        closeReviewModal.addEventListener('click', () => {
            reviewModal.classList.add('hidden');
        });

        async function submitReviewDecision(decision) {
            if (!currentActiveRowIndex) return;
            const comment = supervisorComment.value;
            const supervisor = reviewSupervisorSelect.value;

            approveActionBtn.disabled = true;
            rejectActionBtn.disabled = true;

            const payload = {
                action: "review",
                rowIndex: currentActiveRowIndex,
                decision: decision,
                supervisorName: supervisor,
                comment: comment
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                showCustomMessage(`審核結果已成功儲存：[${decision}]`, "審核完成");
                reviewModal.classList.add('hidden');
                fetchPendingBtn.click();
            } catch (err) {
                console.error(err);
                showCustomMessage("送出審核結果時發生錯誤。", "錯誤");
            } finally {
                approveActionBtn.disabled = false;
                rejectActionBtn.disabled = false;
            }
        }

        approveActionBtn.addEventListener('click', () => submitReviewDecision("核准"));
        rejectActionBtn.addEventListener('click', () => submitReviewDecision("退件"));
    </script>
</body>
</html>
